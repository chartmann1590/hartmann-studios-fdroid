# Tab 2026-11-12 (task c3e94750): Hartmann Studios self-hosted F-Droid repo at /fdroid/.
# Index + icons live in /var/www/fdroid (pulled by /usr/local/sbin/hs-fdroid-pull);
# every repo/*.apk is 302-redirected to its GitHub release asset ($hs_fdroid_apk map).
# Undo: remove the "include /etc/nginx/snippets/hs-fdroid.conf;" lines in conf.d/wordpress_http(s).conf,
#       rm this file and conf.d/01-hs-fdroid-map.conf, nginx -t && systemctl reload nginx.
location ^~ /fdroid/ {
    root /var/www;
    index index.html;
    autoindex off;
    location ~ /\. { deny all; }
    location ~ \.(jar|json)$ { add_header Cache-Control "no-cache, max-age=0" always; }
    location ~ \.apk$ {
        if ($hs_fdroid_apk) { return 302 $hs_fdroid_apk; }
        return 404;
    }
}
