name: Verify with a real client (emulator)

on:
  workflow_dispatch:
    inputs:
      test_pkg:
        description: 'Package to install from the repo'
        default: 'com.charles.flashlight'
      client:
        description: 'droidify or fdroid'
        default: 'droidify'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Fetch the client APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.client }}" = "fdroid" ]; then
            curl -fsSL -o client.apk https://f-droid.org/F-Droid.apk; echo "CLIENT_PKG=org.fdroid.fdroid" >> $GITHUB_ENV
          else
            url=$(gh api repos/Droid-ify/client/releases/latest --jq '[.assets[]|select(.name|endswith(".apk"))][0].browser_download_url')
            echo "$url"; curl -fsSL -o client.apk "$url"; echo "CLIENT_PKG=com.looker.droidify" >> $GITHUB_ENV
          fi
          ls -la client.apk
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          REPO_ADDR: https://charleshartmann.com/fdroid/repo
          REPO_FP: ${{ vars.REPO_FP }}
          TEST_PKG: ${{ inputs.test_pkg }}
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/verify_client.py
      - name: Publish evidence (verify-latest release)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls out || true
          cat out/result.json || true
          tail -c 4000 out/steps.log || true
          (cd out && zip -q ../client-verify.zip * ) || true
          gh release view verify-latest >/dev/null 2>&1 || gh release create verify-latest --title "Client verification evidence (auto)" --notes "Screenshots + result.json from the emulator test." --latest=false
          gh release upload verify-latest client-verify.zip out/result.json out/steps.log --clobber || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-verify
          path: out/
