name: Build F-Droid repo

on:
  schedule:
    - cron: '23 * * * *'      # hourly: cheap check, full build only when a direct release changed
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if nothing changed'
        type: boolean
        default: false
  repository_dispatch:
    types: [direct-release]   # app repos can ping this right after publishing a release

concurrency:
  group: fdroid-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Plan (did any direct release change?)
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || github.event_name == 'repository_dispatch' }}
        run: python scripts/build.py plan
      - name: Install fdroidserver
        if: steps.plan.outputs.changed == 'true'
        run: |
          pip install --quiet fdroidserver pillow
          fdroid --version
          ls "$ANDROID_HOME/build-tools" | tail -3
      - name: Build and sign the index
        if: steps.plan.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FDROID_KEYSTORE_B64: ${{ secrets.FDROID_KEYSTORE_B64 }}
          FDROID_KEY_PASS: ${{ secrets.FDROID_KEY_PASS }}
        run: python scripts/build.py build
      - name: Publish the bundle (repo-latest release)
        if: steps.plan.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view repo-latest >/dev/null 2>&1 || gh release create repo-latest --title "F-Droid repo bundle (auto)" --notes "Built by the workflow. The server at https://charleshartmann.com/fdroid/repo pulls this. Do not edit by hand." --latest=false
          gh release upload repo-latest dist/repo-bundle.tar.gz dist/apk-map.json dist/state.json dist/bundle.sha256 --clobber
          python - <<'EOF'
          import json; s=json.load(open('dist/state.json')); print('apps in index:', s['apps_in_index'], 'not in index:', s['not_in_index'])
          EOF
      - name: Keep the schedule alive (GitHub pauses schedules after 60 idle days)
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45*86400 )) ]; then
            git config user.name "hs-fdroid-bot"; git config user.email "hartmannstudios@mail.tab.bot"
            date -u +%FT%TZ > .keepalive && git add .keepalive && git commit -m "keepalive" && git push
          fi
